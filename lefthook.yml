# Checks that run on this machine before code leaves it. CI runs them again.
pre-commit:
  jobs:
    - name: format and lint
      run: bunx ultracite fix {staged_files}
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css,md,yaml,yml}"
      stage_fixed: true

pre-push:
  jobs:
    - name: types
      run: bun run typecheck
    - name: tests
      run: bun run test
